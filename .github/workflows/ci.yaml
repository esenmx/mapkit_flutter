name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check podspec version matches pubspec
        run: |
          pubspec_version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          status=0
          while IFS= read -r podspec; do
            podspec_version=$(grep -m1 "s\.version" "$podspec" | sed -E "s/.*s\.version[[:space:]]*=[[:space:]]*'([^']+)'.*/\1/")
            if [ "$podspec_version" != "$pubspec_version" ]; then
              echo "::error file=$podspec::podspec version ($podspec_version) does not match pubspec.yaml version ($pubspec_version)"
              status=1
            fi
          done < <(find . -name '*.podspec' -not -path './example/*' -not -path './build/*')
          exit $status
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings

  test:
    name: Test (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: [stable, beta]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      - name: Upload coverage
        if: matrix.flutter == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  pana:
    name: Pana score
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub global activate pana
      - run: pana --no-warning

  example:
    name: Example analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example

  build-example:
    name: Example iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build ios --release --no-codesign
        working-directory: example

  build-example-macos:
    name: Example macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
        working-directory: example
      - run: flutter build macos --debug
        working-directory: example
