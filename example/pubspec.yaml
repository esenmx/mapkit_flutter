name: mapkit_flutter_example
description: Example app for mapkit_flutter.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  mapkit_flutter:
    path: ../

dev_dependencies:
  checks: ^0.3.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
