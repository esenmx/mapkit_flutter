name: mapkit_flutter
description: "MapKit for Flutter — MKMapView on iOS and macOS with Apple's exact symbol names: annotations, clustering, overlays, tile overlays, Look Around, snapshots, mockable controller."
version: 0.3.7
homepage: https://mehmetesen.com
repository: https://github.com/esenmx/mapkit_flutter
issue_tracker: https://github.com/esenmx/mapkit_flutter/issues
documentation: https://pub.dev/documentation/mapkit_flutter/latest/
topics:
  - map
  - ios
  - macos
  - apple
  - flutter-plugin

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0

dev_dependencies:
  build_runner: ^2.15.1
  checks: ^0.3.1
  flutter_test:
    sdk: flutter
  mockito: ^5.6.4
  pigeon: ^27.1.0
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MapKitPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: MapKitPlugin
        sharedDarwinSource: true
