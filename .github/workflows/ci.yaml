name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: git ls-files -z -- '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: CHANGELOG and podspec match the pubspec version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)
          status=0
          top=$(grep -m1 '^## ' CHANGELOG.md || true)
          case "$top" in
            "## Unreleased" | "## $version" | "## $version - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "::error file=CHANGELOG.md::top heading '$top' is neither '## Unreleased' nor '## $version'"; status=1 ;;
          esac
          released=$(grep -m1 -E '^## [0-9]' CHANGELOG.md | sed -E 's/^## ([^ ]+).*/\1/' || true)
          if [ "$released" != "$version" ]; then
            echo "::error file=CHANGELOG.md::newest versioned heading is '$released', pubspec.yaml is $version"
            status=1
          fi
          podspecs=0
          while IFS= read -r podspec; do
            podspecs=$((podspecs+1))
            podspec_version=$(sed -nE "s/.*s\.version[[:space:]]*=[[:space:]]*'([^']+)'.*/\1/p" "$podspec" | head -1)
            if [ "$podspec_version" != "$version" ]; then
              echo "::error file=$podspec::podspec version '$podspec_version', pubspec.yaml is $version"
              status=1
            fi
          done < <(find . -name '*.podspec' -not -path './example/*' -not -path './build/*' -not -path './.dart_tool/*')
          if grep -qE '^[[:space:]]+plugin:' pubspec.yaml && grep -qE '^[[:space:]]+(ios|macos):' pubspec.yaml && [ "$podspecs" -eq 0 ]; then
            echo "::error::pubspec.yaml declares an iOS/macOS plugin but no podspec was found"
            status=1
          fi
          exit $status
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: README and skill snippets compile
        run: dart run tool/check_snippets.dart --import package:mapkit_flutter/mapkit_flutter.dart --import package:flutter/material.dart --import dart:typed_data
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze --fatal-infos --fatal-warnings
        working-directory: example
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: floor, channel: stable, version: '3.47.0' }
          - { name: stable, channel: stable, version: '' }
          - { name: beta, channel: beta, version: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      - run: flutter test
  downgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub downgrade
      - run: flutter analyze --fatal-warnings
      - run: flutter test
  pana:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub global activate pana
      - run: dart pub global run pana --no-warning --exit-code-threshold 0
  publish-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub publish --dry-run
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: Pigeon outputs match the schema
        run: |
          dart run pigeon --input pigeons/messages.dart && dart format lib/src/messages.g.dart
          git diff --exit-code -- lib/src/messages.g.dart darwin/mapkit_flutter/Sources/mapkit_flutter/messages.g.swift
      - name: Mocks match the annotations
        # Blank-line-insensitive: analyzer/source_gen versions differ in blank lines after the header.
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git show HEAD:test/mk_map_view_controller_mock_test.mocks.dart | diff -B - test/mk_map_view_controller_mock_test.mocks.dart
  example-apple:
    name: example (iOS + macOS builds, native tests, macOS integration)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter config --enable-swift-package-manager
      - run: flutter config --enable-macos-desktop
      - working-directory: example
        run: |
          set -e
          flutter build ios --release --no-codesign
          flutter build macos --debug
          xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner -destination 'platform=macOS' -quiet SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      # A macOS integration run can hang after "Failed to foreground app": bound each file, retry once,
      # and accept a green on-device result whose host teardown failed.
      - name: macOS integration
        working-directory: example
        timeout-minutes: 25
        run: |
          set -o pipefail
          for t in integration_test/*_test.dart; do
            for attempt in 1 2; do
              out=$(mktemp); rc=0
              perl -e 'alarm shift; exec @ARGV' 420 flutter test "$t" -d macos 2>&1 | tee "$out" || rc=$?
              [ "$rc" -eq 0 ] && break
              grep -q 'All tests passed' "$out" && { echo "::warning::$t passed; teardown rc=$rc"; break; }
              pkill -f mapkit_flutter_example || true
              [ "$attempt" -eq 2 ] && { echo "::error::$t failed twice"; exit 1; }
            done
          done
  cocoapods-probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter config --no-enable-swift-package-manager
      - name: Build a CocoaPods app against the podspec
        run: |
          set -e
          flutter create --platforms=ios "$RUNNER_TEMP/cp_probe"
          cd "$RUNNER_TEMP/cp_probe"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 17.0;/' ios/Runner.xcodeproj/project.pbxproj
          flutter pub add mapkit_flutter --path "$GITHUB_WORKSPACE"
          flutter build ios --debug --simulator
