name: mapkit_flutter
description: "MapKit for Flutter — MKMapView on iOS and macOS with Apple's exact symbol names: annotations, clustering, overlays, tile overlays, Look Around, snapshots, mockable controller."
version: 0.6.0
repository: https://github.com/esenmx/mapkit_flutter
issue_tracker: https://github.com/esenmx/mapkit_flutter/issues
topics:
  - map
  - ios
  - macos
  - apple
  - flutter-plugin

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  meta: ^1.17.0
  objective_c: ^9.6.4

dev_dependencies:
  api_summary: ^1.2.0
  build_runner: ^2.16.2
  checks: ^0.4.0
  ffigen: ^23.0.0
  # Floors for `pub downgrade`: api_summary's analyzer reaches glob 2.0.0 (whose
  # file 6.0.0 doesn't compile against Dart 3's dart:io), and ffigen's process
  # reaches platform 3.0.0 (whose Platform.packageRoot was removed in Dart 3).
  file: ^7.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  pigeon: 30.0.4
  platform: ^3.1.0
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MapKitPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: MapKitPlugin
        sharedDarwinSource: true
